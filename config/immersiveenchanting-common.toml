
[general]
	#If enabled, Ancient Books are no longer required to unlock enchantments at the enchanting table. Enchantments still cost experience and materials as usual.
	disableAncientBookRequirement = false
	#The number of blocks in the Y-level that the enchanting table can detect chiseled bookshelves. Each 'row' can hold up to 96 books. If you have many enchantments, you may need to increase this value to provide more space.
	#Range: 1 ~ 5
	bookshelfSearchHeight = 3
	#If enabled, Ancient Books are replaced by regular enchanted books. Loot pools are not modified, and regular enchanted books can be placed in chiseled bookshelves to unlock enchantments at the enchanting table.
	vanillaBookMode = true
	#If enabled, enchanting costs XP levels instead of materials. Each enchantment level costs (level * 3) XP levels (e.g. level 1 = 3 levels, level 2 = 6 levels, level 3 = 9 levels). Material costs from datapacks are ignored.
	xpCostMode = true
	#Controls how many enchantment levels are unlocked when a book is placed in a nearby chiseled bookshelf.
	#  Note: This setting only has a meaningful effect when vanillaBookMode is enabled, since vanilla enchanted books carry level information.
	#  With Ancient Books (vanillaBookMode = false), all modes behave the same as mode 2, as Ancient Books carry no level information.
	#  0 = Restrictive: only the exact level of the book is unlocked (e.g. Efficiency III unlocks only level 3).
	#  1 = Default: all levels up to and including the book's level are unlocked (e.g. Efficiency III unlocks levels 1, 2, and 3).
	#  2 = Permissive: all levels of the enchantment are unlocked regardless of the book's level (e.g. Efficiency III unlocks all Efficiency levels).
	#Range: 0 ~ 2
	bookUnlockMode = 2

