
[general]
	#Master toggle for the keybind overlay
	showOverlay = true
	#Global X offset for the overlay list
	#Range: > -2147483648
	offsetX = -5
	#Global Y offset for the overlay list
	#Range: > -2147483648
	offsetY = 0
	#Where the list is anchored on the screen
	#Allowed Values: TOP_LEFT, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_RIGHT, CENTER_LEFT, CENTER_RIGHT
	anchor = "BOTTOM_RIGHT"
	#Animation easing function
	#Allowed Values: LINEAR, EASE_IN_SINE, EASE_OUT_SINE, EASE_IN_OUT_SINE, EASE_IN_QUAD, EASE_OUT_QUAD, EASE_IN_OUT_QUAD, EASE_IN_CUBIC, EASE_OUT_CUBIC, EASE_IN_OUT_CUBIC, EASE_IN_BACK, EASE_OUT_BACK, EASE_IN_OUT_BACK, EASE_OUT_ELASTIC
	easing = "EASE_OUT_BACK"

