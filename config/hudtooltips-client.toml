
[held_tooltip]
	#Whether the held-item tooltip HUD is enabled (also controlled by the toggle key).
	enabled = true
	#Left anchor X for the held tooltip HUD.
	#Range: 0 ~ 10000
	hudX = 6
	#Maximum width of the tooltip panel (wrapped).
	#Range: 120 ~ 420
	maxWidth = 190

[opacity]
	#Base panel opacity (0..255). Lower = more transparent.
	#Range: 0 ~ 255
	panel = 86
	#Shadow opacity (0..255).
	#Range: 0 ~ 255
	shadow = 56
	#Border opacity (0..255).
	#Range: 0 ~ 255
	border = 70
	#Accent strip opacity (0..255).
	#Range: 0 ~ 255
	accent = 130
	#Sheen highlight opacity (0..255).
	#Range: 0 ~ 255
	sheen = 22

[colors]
	#RGB hex colors (no alpha). Example: 0x4EDBFF. Defaults are muted/cool.
	#Range: 0 ~ 16777215
	blocksRGB = 5146367
